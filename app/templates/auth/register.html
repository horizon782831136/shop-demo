{% extends "base.html" %}
{% block title %}注册{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-sm p-8">
        <h1 class="text-2xl font-bold text-gray-900 text-center mb-8">创建账号</h1>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg mb-5">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/register" method="post" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token', '') }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
                <input type="text" name="username" required autocomplete="username"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    placeholder="3-50 个字符">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">邮箱</label>
                <input type="email" name="email" required autocomplete="email"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                <input type="password" name="password" required autocomplete="new-password"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    placeholder="至少 8 个字符">
            </div>
            <button type="submit"
                class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                注册
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            已有账号？
            <a href="/auth/login" class="text-indigo-600 font-medium hover:underline">立即登录</a>
        </p>
    </div>
</div>
{% endblock %}
